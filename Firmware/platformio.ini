[platformio]
src_dir = .
include_dir = .
default_envs = esp32s3_wifi

; Shared settings for both transports
[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5

; Default: host link over the ESP32-S3 native USB port (USB Serial/JTAG, GPIO19/20).
; Plug the cable into the board's native USB connector (shows up as /dev/cu.usbmodem*).
; The microphone is enabled; GPIO43/44 are free for I2S because UART0 is not used.
[env:esp32s3]
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SV_TRANSPORT_USB

; Fallback for boards whose only USB connector goes through a USB-UART bridge on UART0
; (shows up as /dev/cu.usbserial* or /dev/cu.wchusbserial*). UART0 occupies GPIO43/44,
; so the microphone is DISABLED in this build. Host default is 1000000. Measured on the CH340 board: 921600 garbled, 2 Mbaud ~30 % corrupt frames, 1 Mbaud <1 %.
[env:esp32s3_uart]
monitor_speed = 1000000
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D SV_TRANSPORT_UART
    -D SV_UART_BAUD=1000000

; Single-USB-port boards (CH340 bridge on UART0): stream over Wi-Fi so the microphone
; keeps GPIO43/44/0 and the OLED keeps GPIO47/48. The USB cable only powers and flashes.
; Optional: copy wifi_secrets.example.h to wifi_secrets.h to join your network;
; otherwise the node starts the access point defined there.
[env:esp32s3_wifi]
upload_port = /dev/cu.usbserial-110
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D SV_TRANSPORT_WIFI
